services:
  graphdb:
    image: ontotext/graphdb:10.7.0
    container_name: graphdb
    user: root
    environment:
      - GDB_HEAP_SIZE=4g
    volumes:
      - graphdb-data:/opt/graphdb/home
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories/vienna"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    depends_on:
      graphdb:
        condition: service_healthy
    environment:
      - GRAPHDB_URL=http://graphdb:7200/repositories/vienna
      - GRAPHDB_SPARQL=http://graphdb:7200/repositories/vienna
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  elt:
    container_name: elt
    build:
      context: .
      dockerfile: elt/Dockerfile
    depends_on:
      graphdb:
        condition: service_healthy
    environment:
      - GRAPHDB_URL=http://graphdb:7200
      - GRAPHDB_REPO=vienna
      - GRAPHDB_SPARQL=http://graphdb:7200/repositories/vienna
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    command: tail -f /dev/null
    restart: unless-stopped

volumes:
  graphdb-data:
  caddy-data:
  caddy-config: